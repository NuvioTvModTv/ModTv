name: NuvioTV Full Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: modtv-public-releases
  cancel-in-progress: false

jobs:
  full-release:
    if: github.repository == 'NuvioTvModTv/ModTv'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Generate monotonic CI version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/prepare.py version
      - name: Restore signing keystore
        shell: bash
        env:
          NUVIO_KEYSTORE_BASE64: ${{ secrets.NUVIO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${NUVIO_KEYSTORE_BASE64:?Missing signing keystore secret}"
          umask 077
          printf '%s' "$NUVIO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuviotv-mod.jks"
          test -s "$RUNNER_TEMP/nuviotv-mod.jks"
      - name: Build Full Release for armeabi-v7a
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/nuviotv-mod.jks
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_KEY_ALIAS }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_KEYSTORE_PASSWORD }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease --no-parallel --max-workers=1
      - name: Validate signed APKs and prepare manifest
        run: python3 tools/release/prepare.py assets
      - name: Publish complete public Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$MOD_RELEASE_TAG" \
            release-assets/NuvioTV-armeabi-v7a.apk \
            release-assets/NuvioTV-universal.apk \
            release-assets/update.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NuvioTV Mod $MOD_VERSION_NAME — Build $NUVIO_CI_VERSION_CODE" \
            --notes-file release-assets/notes.md --generate-notes --latest
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-Full-Release
          path: '**/*.apk'
          if-no-files-found: error
      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/nuviotv-mod.jks"
